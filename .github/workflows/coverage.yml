name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-coverage:
    name: Collect coverage
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure coverage build
        run: cmake --preset windows-x64-debug -B build/coverage
      - name: Build coverage tests
        run: >-
          cmake --build build/coverage --config Debug --target
          ShowLyricsDomainTests ShowLyricsCuePlaybackIndexTests
          ShowLyricsRealtimeCommunicationTests ShowLyricsLyricsDisplayModelTests
          ShowLyricsPlayHeadIntegrationTests
      - name: Run tests before coverage collection
        run: ctest --test-dir build/coverage -C Debug --output-on-failure
      - name: Collect native C++ coverage
        shell: pwsh
        env:
          DOTNET_COVERAGE_NOLOGO: "1"
          DOTNET_COVERAGE_TELEMETRY_OPTOUT: "1"
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw 'vswhere.exe was not found.'
          }

          $installationPath = & $vswhere `
            -latest `
            -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($installationPath)) {
            throw 'A Visual Studio installation with the MSVC x64 tools was not found.'
          }

          $coverageTool = Join-Path $installationPath `
            'Common7\IDE\Extensions\Microsoft\CodeCoverage.Console\Microsoft.CodeCoverage.Console.exe'
          if (-not (Test-Path -LiteralPath $coverageTool -PathType Leaf)) {
            throw 'Microsoft.CodeCoverage.Console.exe was not found.'
          }

          $coverageReport = Join-Path $PWD 'build\coverage\coverage.cobertura.xml'

          $coverageRuns = @(
            @{
              Executable = (Resolve-Path `
                'build\coverage\Debug\ShowLyricsDomainTests.exe').Path
              Output = Join-Path $PWD 'build\coverage\domain-tests.coverage'
            },
            @{
              Executable = (Resolve-Path `
                'build\coverage\Debug\ShowLyricsCuePlaybackIndexTests.exe').Path
              Output = Join-Path $PWD 'build\coverage\cue-playback-index-tests.coverage'
            },
            @{
              Executable = (Resolve-Path `
                'build\coverage\Debug\ShowLyricsRealtimeCommunicationTests.exe').Path
              Output = Join-Path $PWD 'build\coverage\realtime-communication-tests.coverage'
            },
            @{
              Executable = (Resolve-Path `
                'build\coverage\Debug\ShowLyricsLyricsDisplayModelTests.exe').Path
              Output = Join-Path $PWD 'build\coverage\lyrics-display-model-tests.coverage'
            },
            @{
              Executable = (Resolve-Path `
                'build\coverage\Debug\ShowLyricsPlayHeadIntegrationTests.exe').Path
              Output = Join-Path $PWD 'build\coverage\playhead-integration-tests.coverage'
            }
          )

          $nativeCoverageReports = @()
          foreach ($coverageRun in $coverageRuns) {
            & $coverageTool collect `
              --include-files $coverageRun.Executable `
              --output $coverageRun.Output `
              --output-format coverage `
              --nologo `
              $coverageRun.Executable
            if ($LASTEXITCODE -ne 0) {
              throw "Coverage collection failed with exit code $LASTEXITCODE."
            }

            $nativeCoverageReports += $coverageRun.Output
          }

          $mergeArguments = @('merge') + $nativeCoverageReports + @(
            '--output', $coverageReport,
            '--output-format', 'cobertura',
            '--nologo'
          )
          & $coverageTool @mergeArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Coverage conversion failed with exit code $LASTEXITCODE."
          }

          [xml] $coverageXml = Get-Content -LiteralPath $coverageReport -Raw
          if ([int] $coverageXml.coverage.'lines-valid' -le 0) {
            throw 'The Cobertura report contains no Show Lyrics source coverage.'
          }

          $repositoryRoot = (Resolve-Path -LiteralPath '.').Path.TrimEnd('\', '/') + '\'
          $coverageClasses = @($coverageXml.coverage.packages.package.classes.class)
          foreach ($coverageClass in $coverageClasses) {
            $sourcePath = [string] $coverageClass.filename
            if (-not $sourcePath.StartsWith(
              $repositoryRoot,
              [StringComparison]::OrdinalIgnoreCase
            )) {
              throw "Coverage source is outside the repository: $sourcePath"
            }

            $relativePath = $sourcePath.Substring($repositoryRoot.Length).Replace('\', '/')
            $coverageClass.SetAttribute('filename', $relativePath)
          }

          $coverageXml.Save($coverageReport)
          [xml] $normalizedXml = Get-Content -LiteralPath $coverageReport -Raw
          $normalizedPaths = @(
            $normalizedXml.coverage.packages.package.classes.class |
              ForEach-Object { [string] $_.filename }
          )
          if (@($normalizedPaths | Where-Object { $_ -match '^src/model/LyricCue\.(cpp|h)$' }).Count -eq 0) {
            throw 'The coverage report contains no normalized LyricCue source path.'
          }
          if (@($normalizedPaths | Where-Object { $_ -eq 'src/model/CuePlaybackIndex.cpp' }).Count -eq 0) {
            throw 'The coverage report contains no normalized CuePlaybackIndex source path.'
          }
          if (@($normalizedPaths | Where-Object { $_ -eq 'src/model/CueGenerationExchange.cpp' }).Count -eq 0) {
            throw 'The coverage report contains no normalized CueGenerationExchange source path.'
          }
          if (@($normalizedPaths | Where-Object { $_ -eq 'src/model/TransportSnapshotMailbox.cpp' }).Count -eq 0) {
            throw 'The coverage report contains no normalized TransportSnapshotMailbox source path.'
          }
          if (@($normalizedPaths | Where-Object { $_ -eq 'src/plugin/HostPositionSnapshot.cpp' }).Count -eq 0) {
            throw 'The coverage report contains no normalized HostPositionSnapshot source path.'
          }
          if (@($normalizedPaths | Where-Object { $_ -eq 'src/plugin/LyricsDisplayModel.cpp' }).Count -eq 0) {
            throw 'The coverage report contains no normalized LyricsDisplayModel source path.'
          }
          if (@($normalizedPaths | Where-Object {
            $_ -eq 'src/plugin/testing/CubaseIntegrationFixtureLoader.cpp'
          }).Count -eq 0) {
            throw 'The coverage report contains no normalized CubaseIntegrationFixtureLoader source path.'
          }
      - name: Store coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msvc-coverage
          path: build/coverage/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 1

  upload-coverage:
    name: Upload coverage
    needs: collect-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-msvc-coverage
          path: build/coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: build/coverage/coverage.cobertura.xml
          flags: unit-tests
          name: windows-msvc
          use_oidc: true
          version: v11.3.1
