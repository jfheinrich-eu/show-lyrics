name: Release package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-attach-windows-package:
    name: Build and attach Windows package
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Verify release tag matches project version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $versionMatch = Select-String `
            -LiteralPath CMakeLists.txt `
            -Pattern '^\s*VERSION\s+(?<version>\d+\.\d+\.\d+)\s*$'
          if ($versionMatch.Matches.Count -ne 1) {
            throw 'Exactly one project version was not found in CMakeLists.txt.'
          }
          $expectedTag = "v$($versionMatch.Matches[0].Groups['version'].Value)"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag '$env:RELEASE_TAG' does not match project version '$expectedTag'."
          }
      - name: Download NSIS 3.13
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'nsis-3.13'
          curl.exe --fail --location --output $archive `
            'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip'
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS download failed with exit code $LASTEXITCODE."
          }
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8'
          if ($actualHash -ne $expectedHash) {
            throw "NSIS archive SHA-256 mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $executable = Join-Path $destination 'nsis-3.13\makensis.exe'
          "SHOW_LYRICS_NSIS_EXECUTABLE=$executable" >> $env:GITHUB_ENV
      - name: Build and verify Windows installer
        shell: pwsh
        run: .\scripts\build-windows-installer.ps1
      - name: Attach package to published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $assets = @(
            Get-ChildItem `
              -LiteralPath build\windows-x64-release\package `
              -File |
              Where-Object { $_.Name -match '^Show-Lyrics-\d+\.\d+\.\d+-windows-x64\.exe(\.sha256)?$' } |
              Sort-Object Name
          )
          if ($assets.Count -ne 2) {
            throw "Expected installer and checksum, found $($assets.Count) release assets."
          }
          gh release upload $env:RELEASE_TAG $assets.FullName --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Release asset upload failed with exit code $LASTEXITCODE."
          }
